<svg width="1280" height="320" viewBox="0 0 1280 320" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E2A47"/>
      <stop offset="100%" stop-color="#18406A"/>
    </linearGradient>
    <clipPath id="frame3">
      <rect x="0" y="0" width="1280" height="320"/>
    </clipPath>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8FB4D9"/>
    </marker>
    <marker id="arrowAccent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#C9A227"/>
    </marker>
  </defs>

  <g clip-path="url(#frame3)">
    <rect width="1280" height="320" fill="url(#bg3)"/>

    <!-- blueprint grid -->
    <g stroke="#3A6491" stroke-opacity="0.28" stroke-width="1">
      <line x1="0" y1="40" x2="1280" y2="40"/>
      <line x1="0" y1="80" x2="1280" y2="80"/>
      <line x1="0" y1="120" x2="1280" y2="120"/>
      <line x1="0" y1="160" x2="1280" y2="160"/>
      <line x1="0" y1="200" x2="1280" y2="200"/>
      <line x1="0" y1="240" x2="1280" y2="240"/>
      <line x1="0" y1="280" x2="1280" y2="280"/>
      <line x1="80" y1="0" x2="80" y2="320"/>
      <line x1="200" y1="0" x2="200" y2="320"/>
      <line x1="320" y1="0" x2="320" y2="320"/>
      <line x1="440" y1="0" x2="440" y2="320"/>
      <line x1="560" y1="0" x2="560" y2="320"/>
      <line x1="680" y1="0" x2="680" y2="320"/>
      <line x1="800" y1="0" x2="800" y2="320"/>
      <line x1="920" y1="0" x2="920" y2="320"/>
      <line x1="1040" y1="0" x2="1040" y2="320"/>
      <line x1="1160" y1="0" x2="1160" y2="320"/>
    </g>

    <!-- frame coordinate ticks -->
    <g stroke="#CFE3F2" stroke-opacity="0.5" stroke-width="1.5">
      <line x1="0" y1="0" x2="0" y2="10"/>
      <line x1="1280" y1="0" x2="1280" y2="10"/>
      <line x1="0" y1="320" x2="0" y2="310"/>
      <line x1="1280" y1="320" x2="1280" y2="310"/>
    </g>

    <!-- single-file icon, upper right -->
    <g transform="translate(1212,32)">
      <path d="M0,0 H18 L26,8 V34 H0 Z" fill="none" stroke="#CFE3F2" stroke-width="1.4"/>
      <path d="M18,0 L18,8 L26,8" fill="none" stroke="#CFE3F2" stroke-width="1.2"/>
      <line x1="5" y1="16" x2="21" y2="16" stroke="#8FB4D9" stroke-width="1"/>
      <line x1="5" y1="22" x2="21" y2="22" stroke="#8FB4D9" stroke-width="1"/>
      <line x1="5" y1="28" x2="16" y2="28" stroke="#8FB4D9" stroke-width="1"/>
      <text x="13" y="50" font-family="'Courier New', monospace" font-size="10.5"
            fill="#9FB8CE" text-anchor="middle">.py</text>
    </g>

    <!-- schematic: script -> setup -> web ui, with generated structure branch -->
    <g fill="none" stroke="#8FB4D9" stroke-width="1.3">
      <rect x="660" y="70" width="120" height="42"/>
      <rect x="850" y="70" width="90" height="42"/>
      <line x1="780" y1="91" x2="847" y2="91" marker-end="url(#arrow)"/>
      <line x1="895" y1="112" x2="895" y2="150" marker-end="url(#arrow)"/>
      <line x1="895" y1="150" x2="895" y2="230"/>
      <line x1="940" y1="91" x2="1037" y2="91" marker-end="url(#arrowAccent)"/>
    </g>
    <rect x="1040" y="70" width="112" height="42" fill="none" stroke="#C9A227" stroke-width="1.6"/>

    <g font-family="'Courier New', monospace" font-size="14" fill="#DDE9F5" text-anchor="middle">
      <text x="720" y="96">script.py</text>
      <text x="895" y="96">setup</text>
      <text x="1096" y="96" fill="#F5F7FA">Web UI</text>
    </g>

    <!-- generated structure branch nodes -->
    <g fill="#CFE3F2">
      <circle cx="895" cy="150" r="3.2"/>
      <circle cx="895" cy="190" r="3.2"/>
      <circle cx="895" cy="230" r="3.2"/>
    </g>
    <g stroke="#8FB4D9" stroke-width="1.1">
      <line x1="895" y1="150" x2="915" y2="150"/>
      <line x1="895" y1="190" x2="915" y2="190"/>
      <line x1="895" y1="230" x2="915" y2="230"/>
    </g>
    <g font-family="'Courier New', monospace" font-size="12" fill="#9FB8CE">
      <text x="922" y="154">HPPM/</text>
      <text x="922" y="194">Projects/</text>
      <text x="922" y="234">HPPM.bat</text>
    </g>

    <!-- accent rule -->
    <rect x="80" y="146" width="46" height="3" fill="#C9A227"/>

    <!-- name -->
    <text x="80" y="124" font-family="Arial, Helvetica, sans-serif"
          font-size="50" font-weight="700" fill="#F5F7FA" letter-spacing="0.5">HPPM</text>

    <!-- subtitle -->
    <text x="80" y="176" font-family="'Courier New', monospace" font-size="16.5" fill="#B7CDE0">
      Hemin Python Project Manager
    </text>

    <!-- caption -->
    <text x="80" y="214" font-family="'Courier New', monospace" font-size="13.5" fill="#8FA9C2">
      Single-file project manager for local Python &amp; Jupyter workflows
    </text>

    <!-- scale bar -->
    <g transform="translate(80,250)" stroke="#CFE3F2" stroke-opacity="0.8">
      <line x1="0" y1="0" x2="70" y2="0" stroke-width="1.6"/>
      <line x1="0" y1="-4" x2="0" y2="4" stroke-width="1.6"/>
      <line x1="35" y1="-3" x2="35" y2="3" stroke-width="1.2"/>
      <line x1="70" y1="-4" x2="70" y2="4" stroke-width="1.6"/>
    </g>
    <text x="160" y="254" font-family="'Courier New', monospace" font-size="11" fill="#8FA9C2">scale</text>
  </g>
</svg>
